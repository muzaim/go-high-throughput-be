version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flash_sale_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-flash_sale}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-flash_sale}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flash_sale_app
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: 8080
      ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-flash_sale}
      DB_SSLMODE: disable
      RESERVATION_EXPIRATION_MINUTES: 5
      CLEANUP_INTERVAL_SECONDS: 10
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
